version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: homelibrary
      POSTGRES_USER: homelibrary
      POSTGRES_PASSWORD: homelibrary
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homelibrary"]
      interval: 5s
      timeout: 5s
      retries: 5

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SECRET_KEY: ${SECRET_KEY:-change-me-in-.env}
      DATABASE_URL: postgresql://homelibrary:homelibrary@db:5432/homelibrary
      UPLOAD_FOLDER: /app/uploads
      APP_PREFIX: ${APP_PREFIX:-}
    volumes:
      - uploads_data:/app/uploads
    ports:
      - "8007:8000"

volumes:
  pg_data:
  uploads_data:
