{% extends "base.html" %}
{% block title %}Rejestracja — Home Library{% endblock %}
{% block content %}
<div class="auth-wrapper">
  <div class="card auth-card">
    <div class="card-body">
      <h3 class="text-center mb-4"><i class="bi bi-book-half"></i> Home Library</h3>
      <h5 class="mb-3">Załóż konto</h5>
      <form method="post">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label">Imię</label>
          <input type="text" name="name" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
          <label class="form-label">E-mail</label>
          <input type="email" name="email" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Hasło</label>
          <input type="password" name="password" class="form-control" required minlength="6">
        </div>
        <div class="mb-3">
          <label class="form-label">Powtórz hasło</label>
          <input type="password" name="confirm" class="form-control" required minlength="6">
        </div>
        <button type="submit" class="btn btn-primary w-100">Zarejestruj</button>
      </form>
      <p class="text-center mt-3 mb-0">
        Masz już konto? <a href="{{ url_for('auth.login') }}">Zaloguj się</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
